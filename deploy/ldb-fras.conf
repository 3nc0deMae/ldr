# ============================================================
# LDB-FRAS Apache Virtual Host Configuration
#
# Install: sudo cp deploy/ldb-fras.conf /etc/apache2/sites-available/
# Enable:  sudo a2ensite ldb-fras.conf
# Reload:  sudo systemctl reload apache2
# ============================================================

<VirtualHost *:80>
    ServerName ldb-fras.local
    ServerAlias www.ldb-fras.local
    ServerAdmin admin@liceodebaleno.edu.ph

    DocumentRoot /var/www/ldb-fras

    <Directory /var/www/ldb-fras>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Block access to sensitive directories
    <Directory /var/www/ldb-fras/includes>
        Require all denied
    </Directory>
    <Directory /var/www/ldb-fras/python>
        Require all denied
    </Directory>
    <Directory /var/www/ldb-fras/tests>
        Require all denied
    </Directory>
    <Directory /var/www/ldb-fras/deploy>
        Require all denied
    </Directory>

    # Log files
    ErrorLog ${APACHE_LOG_DIR}/ldb-fras-error.log
    CustomLog ${APACHE_LOG_DIR}/ldb-fras-access.log combined

    # PHP configuration overrides
    <IfModule mod_php.c>
        php_value upload_max_filesize 10M
        php_value post_max_size 12M
        php_value max_execution_time 300
        php_flag display_errors Off
        php_flag log_errors On
    </IfModule>
</VirtualHost>

